[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sponsifable"
dynamic = ["version"]
description = "Price, prove and pitch a creator sponsorship, and seal what you deliver. Local-first, no account, no telemetry."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Lavington" }]
requires-python = ">=3.10"
keywords = ["creator-economy", "sponsorship", "rate-card", "media-kit", "c2pa", "watermark", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "pillow>=10",
  "cryptography>=42",
  "rfc3161ng>=2.1",
  "imagehash>=4.3",
  "c2pa-python>=0.37",
  # OBS's WebSocket, for the on-air log. Pure Python, no build step.
  "websockets>=13",
]

[project.optional-dependencies]
# TrustMark pulls in PyTorch, several hundred megabytes. Serving the app and
# checking receipts do not need it; sealing and decoding a watermark do.
seal = ["trustmark>=0.9.2"]
dev = ["pytest>=8", "markdown>=3.5"]

[project.scripts]
sponsifable = "sponsifable.cli:main"

[project.urls]
Homepage = "https://github.com/idl3o/sponsifable"
Documentation = "https://github.com/idl3o/sponsifable/blob/main/docs/provenance.md"
Issues = "https://github.com/idl3o/sponsifable/issues"
Source = "https://github.com/idl3o/sponsifable"

# One version, in one place: the tag, the package and `sponsifable --version`
# cannot disagree. The release workflow refuses a tag that does not match.
[tool.hatch.version]
path = "python/sponsifable/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["python/sponsifable"]
# The built web app is gitignored, so it has to be named to be included.
artifacts = ["python/sponsifable/web/**"]

[tool.hatch.build.targets.sdist]
include = ["python/sponsifable", "python/tests", "README.md", "LICENSE"]
artifacts = ["python/sponsifable/web/**"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
