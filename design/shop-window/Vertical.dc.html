<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0d0f13; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #e2b658; } a:hover { color: #eec267; }
  </style>
</helmet>
<div style="width: 405px; height: 776px; display: flex; flex-direction: column; background: #0d0f13;">
  <div style="position: relative; width: 405px; height: 720px; overflow: hidden; background: radial-gradient(140% 80% at 40% 25%, #1f2d3f 0%, #0f1620 55%, #07090d 100%);">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(180deg, #111a25 0%, #090c11 100%);"></div>
    <div style="position: absolute; left: 40px; bottom: 260px; width: 330px; height: 190px; background: #16202d; clip-path: polygon(0 100%, 34% 24%, 55% 0, 76% 32%, 100% 100%);"></div>
    <div style="position: absolute; left: 118px; top: 470px; display: flex; align-items: center; gap: 9px; padding: 8px 11px; background: #f4f1ea; border-radius: 8px;">
      <div style="width: 28px; height: 28px; border-radius: 5px; background: #1b2a3b;"></div>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 12.5px; font-weight: 700; color: #14171d;">[SPONSOR]</div>
        <div style="font-size: 9.5px; font-weight: 600; color: #5a6270; letter-spacing: 0.08em;">SPONSORED</div>
      </div>
    </div>

    <svg style="position: absolute; left: 0; top: 0; width: 405px; height: 720px; opacity: {{patternOpacity}};" viewBox="0 0 405 720">
      <defs>
        <pattern id="preview-tile-v" width="240" height="110" patternUnits="userSpaceOnUse" patternTransform="rotate(-22)">
          <text x="0" y="40" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#ffffff">PREVIEW · @KERNOWBUILDS</text>
          <text x="120" y="95" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#ffffff">PREVIEW · @KERNOWBUILDS</text>
        </pattern>
      </defs>
      <rect width="405" height="720" fill="url(#preview-tile-v)"></rect>
    </svg>

    <sc-if value="{{showZones}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 0; top: 0; width: 405px; height: 80px; background: repeating-linear-gradient(135deg, rgba(224, 122, 114, 0.16) 0 8px, rgba(224, 122, 114, 0.05) 8px 16px); border-bottom: 1px dashed #e07a72;"></div>
      <div style="position: absolute; right: 0; top: 330px; width: 62px; height: 250px; background: repeating-linear-gradient(135deg, rgba(224, 122, 114, 0.16) 0 8px, rgba(224, 122, 114, 0.05) 8px 16px); border-left: 1px dashed #e07a72;"></div>
      <div style="position: absolute; left: 0; bottom: 0; width: 405px; height: 150px; background: repeating-linear-gradient(135deg, rgba(224, 122, 114, 0.16) 0 8px, rgba(224, 122, 114, 0.05) 8px 16px); border-top: 1px dashed #e07a72;"></div>
      <div style="position: absolute; left: 12px; top: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; color: #e07a72; letter-spacing: 0.06em;">APP UI · TOP BAR</div>
      <div style="position: absolute; left: 12px; bottom: 124px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; color: #e07a72; letter-spacing: 0.06em;">APP UI · CAPTION AND ACTIONS</div>
      <div style="position: absolute; right: 8px; top: 340px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; color: #e07a72; letter-spacing: 0.06em; writing-mode: vertical-rl;">APP UI · BUTTONS</div>
    </sc-if>

    <sc-if value="{{isWhole}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; {{boardPos}} width: 318px; display: flex; flex-direction: column; border-radius: 9px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.10);">
        <div style="height: 74px; display: flex; align-items: center; justify-content: center; gap: 7px; background: repeating-linear-gradient(135deg, #1a1e26 0 9px, #14171d 9px 18px); color: #8e99ab; font-size: 11.5px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e99ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg>
          <span>Your board image · 318 × 74</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; background: rgba(9, 11, 15, 0.94);">
          <span style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.16em; color: {{accent}};">PREVIEW</span>
          <span style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #c9d0db;">kernow.build/m/1432</span>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{isCompact}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; {{boardPos}} display: flex; align-items: center; gap: 10px; padding: 10px 11px; background: rgba(9, 11, 15, 0.88); border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 9px;">
        <sc-if value="{{isMonogram}}" hint-placeholder-val="{{ true }}">
          <div style="width: 38px; height: 38px; border-radius: 7px; background: {{accent}}; color: #191305; font-weight: 720; font-size: 14px; display: flex; align-items: center; justify-content: center;">KB</div>
        </sc-if>
        <sc-if value="{{isLogo}}" hint-placeholder-val="{{ false }}">
          <div style="width: 58px; height: 42px; border-radius: 7px; border: 1.5px dashed #616c7d; display: flex; align-items: center; justify-content: center; color: #8e99ab;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e99ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg>
          </div>
        </sc-if>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.16em; color: {{accent}};">PREVIEW</span>
          <div style="font-size: 16px; font-weight: 650; color: #e7eaf0;">License this moment</div>
          <div style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #c9d0db;">kernow.build/m/1432</div>
        </div>
        <sc-if value="{{showQr}}" hint-placeholder-val="{{ true }}">
          <svg width="68" height="68" viewBox="0 0 76 76" style="flex: none;">
            <rect width="76" height="76" rx="4" fill="#ffffff"></rect>
            <g fill="#0d0f13">
              <rect x="6" y="6" width="20" height="20"></rect><rect x="10" y="10" width="12" height="12" fill="#ffffff"></rect><rect x="13" y="13" width="6" height="6"></rect>
              <rect x="50" y="6" width="20" height="20"></rect><rect x="54" y="10" width="12" height="12" fill="#ffffff"></rect><rect x="57" y="13" width="6" height="6"></rect>
              <rect x="6" y="50" width="20" height="20"></rect><rect x="10" y="54" width="12" height="12" fill="#ffffff"></rect><rect x="13" y="57" width="6" height="6"></rect>
            </g>
            <text x="48" y="54" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#616c7d">QR</text>
          </svg>
        </sc-if>
      </div>
    </sc-if>
  </div>
  <div style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-top: 1px solid #262c36; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: #8e99ab;">
    <span style="color: #e2b658;">VERTICAL · 9:16</span>
    <sc-if value="{{unsafe}}" hint-placeholder-val="{{ false }}">
      <span style="display: inline-flex; align-items: center; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid #4c2f2c; color: #e07a72; background: #201615;">Under the caption area. Move it up.</span>
    </sc-if>
    <sc-if value="{{safe}}" hint-placeholder-val="{{ true }}">
      <span>Board clear of the app's own UI.</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#e2b658","options":["#e2b658","#5fc3d4","#6fcf97"],"section":"Board"},"position":{"editor":"enum","options":["upper-left","middle-left","bottom"],"default":"middle-left","section":"Board"},"mark":{"editor":"enum","options":["monogram","logo image","whole board image"],"default":"monogram","section":"Board"},"showQr":{"editor":"boolean","default":true,"section":"Board"},"showZones":{"editor":"boolean","default":true,"section":"Check"},"pattern":{"editor":"range","min":0.04,"max":0.3,"step":0.02,"default":0.12,"section":"Protection"}}'>
class Component extends DCLogic {
  renderVals() {
    const positions = {
      'upper-left': 'left: 14px; top: 96px;',
      'middle-left': 'left: 14px; top: 230px;',
      bottom: 'left: 14px; bottom: 34px;',
    };
    const position = this.props.position ?? 'middle-left';
    const mark = this.props.mark ?? 'monogram';
    return {
      accent: this.props.accent ?? '#e2b658',
      boardPos: positions[position] ?? positions['middle-left'],
      isMonogram: mark === 'monogram',
      isLogo: mark === 'logo image',
      isWhole: mark === 'whole board image',
      isCompact: mark !== 'whole board image',
      showQr: this.props.showQr ?? true,
      showZones: this.props.showZones ?? true,
      patternOpacity: this.props.pattern ?? 0.12,
      unsafe: position === 'bottom',
      safe: position !== 'bottom',
    };
  }
}
</script>
</body>
</html>
